schema_version: 1
kind: evaluation
evaluation:
  name: open-to-first-response-latency
  description: Hours from TicketOpened to FirstResponse for the same ticket.
  interval:
    start_event: TicketOpened
    end_event: FirstResponse
  metric: duration
  aggregation: median
  unit: hours
  baseline:
    value: 26
    description: Baseline median open-to-first-response latency.
  target:
    comparator: lt
    value: 4
    description: Strict target; a median of exactly 4 hours is a miss.
  metrics:
    reopen_rate:
      entity: Resolution
      ref: ticket
      flag: reopened
      noun: reopens
      description: Rate of Resolution entities carrying a boolean reopened flag that is true, per cohort.
  guardrails:
    - name: reopen-rate
      metric: reopen_rate
      comparator: not_increase
      description: Reopen rate must not increase versus baseline.
