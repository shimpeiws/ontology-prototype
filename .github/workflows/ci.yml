name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/core[test]" -e "apps/cli[test]" -e "apps/api[test]"
      - name: Run tests
        run: python -m pytest -q
      - name: Check reference workspace through the CLI
        run: ontology check examples/job-invoicing
      - name: API opens the reference workspace under a configured root
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from ontology_api import ApiConfig, create_app
          app = create_app(ApiConfig(workspace_roots=("examples",)))
          client = TestClient(app)
          response = client.post(
              "/api/v1/workspaces/open", json={"path": "job-invoicing"}
          )
          assert response.status_code == 200, response.text
          assert response.json()["valid"] is True, response.json()
          PY

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  core-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core only
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/core[test]"
      - name: Core imports without apps installed
        run: |
          python - <<'PY'
          import sys
          import ontology_core
          assert "ontology_cli" not in sys.modules
          assert "ontology_api" not in sys.modules
          assert "fastapi" not in sys.modules
          print("ontology_core", ontology_core.__version__)
          PY
      - name: Run core tests
        run: python -m pytest -q packages/core/tests
      - name: Core loads the reference workspace directly
        run: |
          python - <<'PY'
          from ontology_core import load_workspace
          result = load_workspace("examples/job-invoicing")
          assert result.ok, [d.format() for d in result.diagnostics]
          print("workspace valid:", result.workspace.domain.name)
          PY
