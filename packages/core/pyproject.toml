[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ontology-core"
version = "0.0.1"
description = "Shared operational core: workspace contracts, loading, and validation for the FDE operational loop."
readme = { text = "Shared operational core for the ontology-prototype monorepo.", content-type = "text/plain" }
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ontology_core = ["py.typed", "eval_fixtures/workspace/*.yaml", "eval_fixtures/data/*.csv", "eval_fixtures/outputs/*"]
