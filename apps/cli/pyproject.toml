[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ontology-cli"
version = "0.0.1"
description = "CLI application for the FDE operational loop; delegates all workspace logic to ontology-core."
readme = { text = "CLI application for the ontology-prototype monorepo.", content-type = "text/plain" }
license = "MIT"
requires-python = ">=3.11"
dependencies = ["ontology-core>=0.0.1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ontology = "ontology_cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
